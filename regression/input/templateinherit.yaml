#
#  Test a templated derived class whose base class is templated, e.g.
#      template<typename T> class DerivedMatrix : public BaseMatrix<T>
#  The base may use a subset of the derived class's parameters or a
#  concrete type; each instantiation of the derived class extends the
#  matching instantiation of the base.
#  The Fortran derived type preserves the inheritance via 'type, extends'.
#
copyright:
- Copyright Shroud Project Developers. See LICENSE file for details.
-
- "SPDX-License-Identifier: (BSD-3-Clause)"
-

library: templateinherit
cxx_header: templateinherit.hpp

options:
  debug: True

declarations:
- decl: template<typename T> class BaseMatrix
  cxx_template:
  - instantiation: <int>
  - instantiation: <double>
  declarations:
  - decl: BaseMatrix()
  - decl: void set_base(T v)
  # Not part of the <int> instantiation.  BaseMatrix_int, and
  # DerivedMatrix_int which extends it, have no get_base.
  - decl: T get_base()
    cxx_template_exclude:
    - instantiation: <int>

- decl: |
    template<typename T>
    class DerivedMatrix : public BaseMatrix<T>
  cxx_template:
  - instantiation: <int>
  - instantiation: <double>
  declarations:
  - decl: DerivedMatrix()
  - decl: void set_derived(T v)
  - decl: T get_derived()

# The base class may be templated on a subset of the derived class's
# parameters,   MixedMatrix<int,double> : public BaseMatrix<int>
- decl: |
    template<typename T, typename U>
    class MixedMatrix : public BaseMatrix<T>
  cxx_template:
  - instantiation: <int, double>
    format:
      template_suffix: _int_double
  - instantiation: <double, int>
    format:
      template_suffix: _double_int
  declarations:
  - decl: MixedMatrix()
  # Multiple template parameters.  The instantiation is spelled without a
  # blank to show that typemaps, not strings, are compared.
  - decl: void set_mixed(T v, U w)
    cxx_template_exclude:
    - instantiation: <int,double>
  - decl: U get_mixed()
  # A member template.  The class carries an explicit template_suffix, which
  # must not name the methods; only this function's own instantiation does,
  # giving convert_int and convert_double.
  # cxx_template_exclude names an instantiation of the enclosing class, not
  # of the member template, so both convert_int and convert_double are
  # dropped from MixedMatrix<double,int> and kept in MixedMatrix<int,double>.
  - decl: template<typename V> void convert(V value)
    cxx_template:
    - instantiation: <int>
    - instantiation: <double>
    cxx_template_exclude:
    - instantiation: <double, int>

# The base class may also be templated on a concrete type.
- decl: |
    template<typename T>
    class ConcreteMatrix : public BaseMatrix<double>
  cxx_template:
  - instantiation: <int>
  - instantiation: <double>
  declarations:
  - decl: ConcreteMatrix()
  - decl: void set_concrete(T v)
